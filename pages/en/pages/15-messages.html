<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#C17A82" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Trailkin — Messages</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/pages/15-messages.css" />
  </head>
  <body>
    <!-- Static export of the "Messages" screen. No JavaScript on purpose: every interactive element carries a data-action / data-on-input / data-on-change attribute holding the original prototype handler as a hint. Wire these up yourself. -->
    <div id="shell">
      <div id="topbar" class="topbar">
        <div class="u1"></div>
        <span class="display u2">🥾 Trailkin</span><!-- TODO: wire up button — 🔔 --><button
          class="back-btn u3"
          aria-label="Notifications"
          data-action="openNotifFeed()"
        >
          🔔
        </button>
      </div>
      <div id="screen">
        <h2 class="u4">Messages</h2>
        <div class="card row u5" data-action="openChat('messages')">
          <div class="avatar">A</div>
          <div class="u6">
            <div class="u7">Parz Lake — Goshavank</div>
            <div class="muted">I'll bring extra water 💧</div>
          </div>
        </div>
        <div class="card row u8" data-action="openDM('Sofia', 'messages')">
          <div class="avatar u9">S</div>
          <div class="u6">
            <div class="u7">Sofia</div>
            <div class="muted">Yes! I will bring snacks.</div>
          </div>
        </div>
        <div class="card row u8" data-action="openDM('Anna', 'messages')">
          <div class="avatar u9">A</div>
          <div class="u6">
            <div class="u7">Anna</div>
            <div class="muted">See you at the trailhead at 9:15!</div>
          </div>
        </div>
      </div>

      <div id="tabbar" class="tabbar">
        <!-- TODO: wire up button — 🏠Home --><button class="tab" data-action="go('home')">
          <span class="ic">🏠</span>Home
        </button>
        <!-- TODO: wire up button — 🧭Explore --><button class="tab" data-action="go('explore')">
          <span class="ic">🧭</span>Explore
        </button>
        <!-- TODO: wire up button — 🥾Routes --><button class="tab" data-action="goRoutesTab()">
          <span class="ic">🥾</span>Routes
        </button>
        <!-- TODO: wire up button — 💬Messages --><button class="tab active" data-action="go('messages')">
          <span class="ic">💬</span>Messages
        </button>
        <!-- TODO: wire up button — 👤Profile --><button class="tab" data-action="go('profileMe')">
          <span class="ic">👤</span>Profile
        </button>
      </div>
    </div>
  </body>
</html>
