<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#C17A82" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Trailkin — Welcome</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/pages/01-welcome.css" />
  </head>
  <body>
    <!-- Static export of the "Welcome" screen. No JavaScript on purpose: every interactive element carries a data-action / data-on-input / data-on-change attribute holding the original prototype handler as a hint. Wire these up yourself. -->
    <div id="shell">
      <div id="topbar" class="topbar"></div>
      <div id="screen">
        <div class="u1">
          <div class="u2">🥾</div>
          <h1 class="display u3">Find your trail. Find your people.</h1>
          <p class="muted u4">This weekend, you have someone to hike with.</p>
          <div class="lang-toggle u5">
            <!-- TODO: wire up button — EN --><button class="active" data-action="toggleLang('en')">
              EN
            </button>
            <!-- TODO: wire up button — RU --><button class="" data-action="toggleLang('ru')">RU</button>
          </div>
          <div class="u6">
            <!-- TODO: wire up button — Get started --><button
              class="btn btn-primary"
              data-action="go('signIn')"
            >
              Get started
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
