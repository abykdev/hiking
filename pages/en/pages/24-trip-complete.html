<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#C17A82" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Trailkin — Hike complete</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/pages/24-trip-complete.css" />
  </head>
  <body>
    <!-- Static export of the "Hike complete" screen. No JavaScript on purpose: every interactive element carries a data-action / data-on-input / data-on-change attribute holding the original prototype handler as a hint. Wire these up yourself. -->
    <div id="shell">
      <div id="topbar" class="topbar">
        <div class="u1"></div>
        <span class="display u2">🥾 Trailkin</span><!-- TODO: wire up button — 🔔 --><button
          class="back-btn u3"
          aria-label="Notifications"
          data-action="openNotifFeed()"
        >
          🔔
        </button>
      </div>
      <div id="screen">
        <div class="u4">
          <h2 class="u5">Hike complete! 🎉</h2>
          <p class="muted">Nice work — here's your summary.</p>
        </div>

        <div class="section-title">Your route</div>

        <div class="u6">
          <svg width="100%" height="100%" viewBox="0 0 300 220">
            <path
              d="M280.0,200.0 L142.0,118.6 L20.0,20.0"
              fill="none"
              stroke="#C17A82"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></path>
            <circle cx="280.0" cy="200.0" r="6" fill="#C9A6AE" stroke="#fff" stroke-width="2"></circle>
            <circle cx="20.0" cy="20.0" r="7" fill="#C17A82" stroke="#fff" stroke-width="2.5"></circle>
          </svg>
        </div>

        <div class="card u7">
          <div class="space-between">
            <div>
              <div class="muted u8">Distance</div>
              <div class="u9">0.63 km</div>
            </div>
            <div>
              <div class="muted u8">Duration</div>
              <div class="u9">95 min</div>
            </div>
          </div>
          <div class="space-between u10">
            <div>
              <div class="muted u8">Elevation gain</div>
              <div class="u9">+250 m</div>
            </div>
            <div>
              <div class="muted u8">Est. steps</div>
              <div class="u9">834</div>
            </div>
          </div>
        </div>

        <!-- TODO: wire up button — Continue --><button
          class="btn btn-primary u11"
          data-action="go('review')"
        >
          Continue
        </button>
      </div>

      <div id="tabbar" class="tabbar">
        <!-- TODO: wire up button — 🏠Home --><button class="tab" data-action="go('home')">
          <span class="ic">🏠</span>Home
        </button>
        <!-- TODO: wire up button — 🧭Explore --><button class="tab" data-action="go('explore')">
          <span class="ic">🧭</span>Explore
        </button>
        <!-- TODO: wire up button — 🥾Routes --><button class="tab" data-action="goRoutesTab()">
          <span class="ic">🥾</span>Routes
        </button>
        <!-- TODO: wire up button — 💬Messages --><button class="tab" data-action="go('messages')">
          <span class="ic">💬</span>Messages
        </button>
        <!-- TODO: wire up button — 👤Profile --><button class="tab" data-action="go('profileMe')">
          <span class="ic">👤</span>Profile
        </button>
      </div>
    </div>
  </body>
</html>
