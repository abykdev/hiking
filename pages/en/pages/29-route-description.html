<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#C17A82" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Trailkin — Route description</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/pages/29-route-description.css" />
  </head>
  <body>
    <!-- Static export of the "Route description" screen. No JavaScript on purpose: every interactive element carries a data-action / data-on-input / data-on-change attribute holding the original prototype handler as a hint. Wire these up yourself. -->
    <div id="shell">
      <div id="topbar" class="topbar">
        <!-- TODO: wire up button — ← --><button class="back-btn" data-action="goBack('explore')">←</button
        ><span class="display u1">🥾 Trailkin</span><!-- TODO: wire up button — 🔔 --><button
          class="back-btn u2"
          aria-label="Notifications"
          data-action="openNotifFeed()"
        >
          🔔
        </button>
      </div>
      <div id="screen">
        <h2 class="u3">Sunset ridge loop</h2>
        <div class="muted u4">3.40 km · 72 min · 8 points</div>

        <div class="u5">
          <svg width="100%" height="100%" viewBox="0 0 300 220">
            <path
              d="M20.0,200.0 L53.8,174.7 L72.0,146.3 L118.8,117.9 L173.4,102.1 L220.2,80.0 L243.6,45.3 L280.0,20.0"
              fill="none"
              stroke="#C17A82"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></path>
            <circle cx="20.0" cy="200.0" r="6" fill="#C9A6AE" stroke="#fff" stroke-width="2"></circle>
            <circle cx="280.0" cy="20.0" r="7" fill="#C17A82" stroke="#fff" stroke-width="2.5"></circle>
          </svg>
        </div>
        <!-- TODO: wire up button — 🧭 Follow this route --><button
          class="btn btn-primary u6"
          data-action="followRoute('r1')"
        >
          🧭 Follow this route
        </button>
        <p class="u7">A gentle loop with great views over the valley.</p>

        <div class="section-title">Photos</div>
        <p class="muted">No photos added for this route yet.</p>

        <!-- TODO: wire up button — Add route --><button
          class="btn btn-outline u8"
          data-action="toggleSavedRoute('r1')"
        >
          Add route
        </button>
      </div>

      <div id="tabbar" class="tabbar">
        <!-- TODO: wire up button — 🏠Home --><button class="tab" data-action="go('home')">
          <span class="ic">🏠</span>Home
        </button>
        <!-- TODO: wire up button — 🧭Explore --><button class="tab" data-action="go('explore')">
          <span class="ic">🧭</span>Explore
        </button>
        <!-- TODO: wire up button — 🥾Routes --><button class="tab" data-action="goRoutesTab()">
          <span class="ic">🥾</span>Routes
        </button>
        <!-- TODO: wire up button — 💬Messages --><button class="tab" data-action="go('messages')">
          <span class="ic">💬</span>Messages
        </button>
        <!-- TODO: wire up button — 👤Profile --><button class="tab" data-action="go('profileMe')">
          <span class="ic">👤</span>Profile
        </button>
      </div>
    </div>
  </body>
</html>
