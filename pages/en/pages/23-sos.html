<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#C17A82" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Trailkin — SOS</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/pages/23-sos.css" />
  </head>
  <body>
    <!-- Static export of the "SOS" screen. No JavaScript on purpose: every interactive element carries a data-action / data-on-input / data-on-change attribute holding the original prototype handler as a hint. Wire these up yourself. -->
    <div id="shell">
      <div id="activebar">
        <div class="active-bar" data-action="go('activeTrip')">
          <span><span class="pulse"></span>TRIP ACTIVE</span><span>Navigation →</span>
        </div>
      </div>
      <div id="topbar" class="topbar">
        <!-- TODO: wire up button — ← --><button class="back-btn" data-action="goBack('activeTrip')">←</button
        ><span class="display u1">🥾 Trailkin</span><!-- TODO: wire up button — 🔔 --><button
          class="back-btn u2"
          aria-label="Notifications"
          data-action="openNotifFeed()"
        >
          🔔
        </button>
      </div>
      <div id="screen">
        <h2 class="u3">SOS</h2>
        <p class="muted">Your location and plan, ready to share.</p>
        <div class="card u4">
          <div class="muted">Current coordinates</div>
          <div class="u5">Location unavailable</div>
          <!-- TODO: wire up button — 📍 Get my location --><button
            class="btn btn-outline btn-sm u6"
            data-action="requestLocation()"
          >
            📍 Get my location
          </button>
          <div class="divider"></div>
          <div class="muted">Nearest known exit point</div>
          <div class="u7">Park entrance parking lot</div>
        </div>

        <div class="u8">
          <a class="btn btn-alert u9" href="tel:112">Call emergency services</a>
          <!-- TODO: wire up button — Call trusted contact --><button
            class="btn btn-secondary"
            data-action="showToast('No phone number saved for your trusted contact.')"
          >
            Call trusted contact
          </button>
          <!-- TODO: wire up button — Share current location --><button
            class="btn btn-outline"
            data-action="requestLocation()"
          >
            Share current location
          </button>
          <!-- TODO: wire up button — Copy GPS coordinates --><button
            class="btn btn-outline"
            data-action="copyCoords()"
          >
            Copy GPS coordinates
          </button>
        </div>
        <div class="u10">
          <!-- TODO: wire up button — ← Back to trip --><button
            class="btn btn-secondary"
            data-action="go('activeTrip')"
          >
            ← Back to trip
          </button>
        </div>
      </div>

      <div id="tabbar" class="tabbar">
        <!-- TODO: wire up button — 🏠Home --><button class="tab" data-action="go('home')">
          <span class="ic">🏠</span>Home
        </button>
        <!-- TODO: wire up button — 🧭Explore --><button class="tab" data-action="go('explore')">
          <span class="ic">🧭</span>Explore
        </button>
        <!-- TODO: wire up button — 🥾Routes --><button class="tab" data-action="goRoutesTab()">
          <span class="ic">🥾</span>Routes
        </button>
        <!-- TODO: wire up button — 💬Messages --><button class="tab" data-action="go('messages')">
          <span class="ic">💬</span>Messages
        </button>
        <!-- TODO: wire up button — 👤Profile --><button class="tab" data-action="go('profileMe')">
          <span class="ic">👤</span>Profile
        </button>
      </div>
    </div>
  </body>
</html>
