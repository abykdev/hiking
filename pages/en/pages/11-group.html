<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#C17A82" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Trailkin — Group</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/pages/11-group.css" />
  </head>
  <body>
    <!-- Static export of the "Group" screen. No JavaScript on purpose: every interactive element carries a data-action / data-on-input / data-on-change attribute holding the original prototype handler as a hint. Wire these up yourself. -->
    <div id="shell">
      <div id="topbar" class="topbar">
        <!-- TODO: wire up button — ← --><button class="back-btn" data-action="goBack('hikeDetail')">←</button
        ><span class="display u1">🥾 Trailkin</span><!-- TODO: wire up button — 🔔 --><button
          class="back-btn u2"
          aria-label="Notifications"
          data-action="openNotifFeed()"
        >
          🔔
        </button>
      </div>
      <div id="screen">
        <h2 class="u3">Parz Lake — Goshavank</h2>
        <div class="muted">09:30 · Dilijan</div>

        <div class="section-title">Confirmed (4/5)</div>
        <div class="card">
          <div class="row u4">
            <div class="avatar clickable" data-action="viewProfile('Anna')">A</div>
            <div data-action="viewProfile('Anna')" class="u5">Anna</div>
            <span class="u6">✓</span>
          </div>
          <div class="row u4">
            <div class="avatar clickable" data-action="viewProfile('Elena')">E</div>
            <div data-action="viewProfile('Elena')" class="u5">Elena</div>
            <span class="u6">✓</span>
          </div>
          <div class="row u4">
            <div class="avatar clickable" data-action="viewProfile('Maria')">M</div>
            <div data-action="viewProfile('Maria')" class="u5">Maria</div>
            <span class="u6">✓</span>
          </div>
          <div class="row u4">
            <div class="avatar clickable" data-action="viewProfile('Sofia')">S</div>
            <div data-action="viewProfile('Sofia')" class="u5">Sofia</div>
            <span class="u6">✓</span>
          </div>
        </div>

        <div class="section-title">How are we getting there?</div>
        <div class="card">
          <div class="row u4">
            <div class="avatar">A</div>
            <div class="u7">Anna — 🚗 2 seats</div>
            <!-- TODO: wire up button — Request a seat --><button
              class="btn btn-outline btn-sm"
              data-action="showToast(t('requestSeat'))"
            >
              Request a seat
            </button>
          </div>
        </div>

        <div class="section-title">Group chat</div>
        <div class="card u8" id="chatBox">
          <div class="msg"><strong class="u9">Anna</strong>See you all at the trailhead at 9:15!</div>
          <div class="msg"><strong class="u9">Elena</strong>I'll bring extra water 💧</div>
        </div>
        <div class="row u10">
          <input type="text" id="chatInput" placeholder="Message…" class="u11" />
          <!-- TODO: wire up button — Send --><button class="btn btn-primary btn-sm" data-action="sendMsg()">
            Send
          </button>
        </div>

        <div class="u12">
          <!-- TODO: wire up button — View route --><button
            class="btn btn-primary"
            data-action="go('hikeDetail')"
          >
            View route
          </button>
        </div>
        <!-- TODO: wire up button — Leave group --><button
          class="btn btn-outline u13"
          data-action="confirmLeaveGroup()"
        >
          Leave group
        </button>
      </div>

      <div id="tabbar" class="tabbar">
        <!-- TODO: wire up button — 🏠Home --><button class="tab" data-action="go('home')">
          <span class="ic">🏠</span>Home
        </button>
        <!-- TODO: wire up button — 🧭Explore --><button class="tab" data-action="go('explore')">
          <span class="ic">🧭</span>Explore
        </button>
        <!-- TODO: wire up button — 🥾Routes --><button class="tab" data-action="goRoutesTab()">
          <span class="ic">🥾</span>Routes
        </button>
        <!-- TODO: wire up button — 💬Messages --><button class="tab" data-action="go('messages')">
          <span class="ic">💬</span>Messages
        </button>
        <!-- TODO: wire up button — 👤Profile --><button class="tab" data-action="go('profileMe')">
          <span class="ic">👤</span>Profile
        </button>
      </div>
    </div>
  </body>
</html>
