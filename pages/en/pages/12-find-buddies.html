<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#C17A82" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Trailkin — Find buddies</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/pages/12-find-buddies.css" />
  </head>
  <body>
    <!-- Static export of the "Find buddies" screen. No JavaScript on purpose: every interactive element carries a data-action / data-on-input / data-on-change attribute holding the original prototype handler as a hint. Wire these up yourself. -->
    <div id="shell">
      <div id="topbar" class="topbar">
        <!-- TODO: wire up button — ← --><button class="back-btn" data-action="goBack('home')">←</button
        ><span class="display u1">🥾 Trailkin</span><!-- TODO: wire up button — 🔔 --><button
          class="back-btn u2"
          aria-label="Notifications"
          data-action="openNotifFeed()"
        >
          🔔
        </button>
      </div>
      <div id="screen">
        <h2 class="u3">Find Buddies</h2>
        <div class="card row clickable u4" data-action="viewProfile('Sofia')">
          <div class="avatar u5">S</div>
          <div class="u6">
            <div class="u7">Sofia</div>
            <div class="muted u8">Yerevan, Armenia · 31 hikes · New hiker</div>
          </div>
        </div>

        <div class="chip-row u9">
          <div class="chip">📅 Sat, Sep 28</div>
          <div class="chip">🗺️ Dilijan</div>
          <div class="chip">🥾 Moderate</div>
        </div>

        <h3 class="u10">Looking for buddies for Saturday</h3>
        <p class="u11">
          Hi! I'd love to find 2-3 people to hike Parz Lake - Goshavank this Saturday. Moderate pace, around
          8-10 km. Open to new friends!
        </p>

        <div class="u12"></div>

        <div class="u13">
          <!-- TODO: wire up button — Join --><button
            class="btn btn-primary"
            data-action="joinBuddyAndChat()"
          >
            Join
          </button>
          <!-- TODO: wire up button — 🥾 Join this hike --><button
            class="btn btn-outline"
            data-action="joinHike()"
          >
            🥾 Join this hike
          </button>
        </div>
      </div>

      <div id="tabbar" class="tabbar">
        <!-- TODO: wire up button — 🏠Home --><button class="tab" data-action="go('home')">
          <span class="ic">🏠</span>Home
        </button>
        <!-- TODO: wire up button — 🧭Explore --><button class="tab" data-action="go('explore')">
          <span class="ic">🧭</span>Explore
        </button>
        <!-- TODO: wire up button — 🥾Routes --><button class="tab" data-action="goRoutesTab()">
          <span class="ic">🥾</span>Routes
        </button>
        <!-- TODO: wire up button — 💬Messages --><button class="tab" data-action="go('messages')">
          <span class="ic">💬</span>Messages
        </button>
        <!-- TODO: wire up button — 👤Profile --><button class="tab" data-action="go('profileMe')">
          <span class="ic">👤</span>Profile
        </button>
      </div>
    </div>
  </body>
</html>
