<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#C17A82" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Trailkin — Privacy</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/pages/35-privacy.css" />
  </head>
  <body>
    <!-- Static export of the "Privacy" screen. No JavaScript on purpose: every interactive element carries a data-action / data-on-input / data-on-change attribute holding the original prototype handler as a hint. Wire these up yourself. -->
    <div id="shell">
      <div id="topbar" class="topbar">
        <!-- TODO: wire up button — ← --><button class="back-btn" data-action="goBack('profileMe')">←</button
        ><span class="display u1">🥾 Trailkin</span><!-- TODO: wire up button — 🔔 --><button
          class="back-btn u2"
          aria-label="Notifications"
          data-action="openNotifFeed()"
        >
          🔔
        </button>
      </div>
      <div id="screen">
        <h2 class="u3">Privacy</h2>
        <div class="card toggle-row u4">
          <span class="u5">Profile visible to others</span>
          <div class="switch on" data-action="togglePrivacySetting('profileVisible')">
            <div class="knob"></div>
          </div>
        </div>
        <div class="card toggle-row u4">
          <span class="u5">Share location by default on new hikes</span>
          <div class="switch" data-action="togglePrivacySetting('shareLocationDefault')">
            <div class="knob"></div>
          </div>
        </div>

        <div class="section-title">Blocked users</div>
        <p class="muted">You haven't blocked anyone.</p>

        <!-- TODO: wire up button — Export my data --><button
          class="btn btn-outline u6"
          data-action="exportMyData()"
        >
          Export my data
        </button>
        <!-- TODO: wire up button — Delete account --><button
          class="btn btn-outline u7"
          data-action="confirmDeleteAccount()"
        >
          Delete account
        </button>
      </div>

      <div id="tabbar" class="tabbar">
        <!-- TODO: wire up button — 🏠Home --><button class="tab" data-action="go('home')">
          <span class="ic">🏠</span>Home
        </button>
        <!-- TODO: wire up button — 🧭Explore --><button class="tab" data-action="go('explore')">
          <span class="ic">🧭</span>Explore
        </button>
        <!-- TODO: wire up button — 🥾Routes --><button class="tab" data-action="goRoutesTab()">
          <span class="ic">🥾</span>Routes
        </button>
        <!-- TODO: wire up button — 💬Messages --><button class="tab" data-action="go('messages')">
          <span class="ic">💬</span>Messages
        </button>
        <!-- TODO: wire up button — 👤Profile --><button class="tab" data-action="go('profileMe')">
          <span class="ic">👤</span>Profile
        </button>
      </div>
    </div>
  </body>
</html>
