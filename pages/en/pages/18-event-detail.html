<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#C17A82" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Trailkin — Event detail</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/pages/18-event-detail.css" />
  </head>
  <body>
    <!-- Static export of the "Event detail" screen. No JavaScript on purpose: every interactive element carries a data-action / data-on-input / data-on-change attribute holding the original prototype handler as a hint. Wire these up yourself. -->
    <div id="shell">
      <div id="topbar" class="topbar">
        <!-- TODO: wire up button — ← --><button class="back-btn" data-action="goBack('home')">←</button
        ><span class="display u1">🥾 Trailkin</span><!-- TODO: wire up button — 🔔 --><button
          class="back-btn u2"
          aria-label="Notifications"
          data-action="openNotifFeed()"
        >
          🔔
        </button>
      </div>
      <div id="screen">
        <div class="hero-img u3"><div class="display u4">🥾</div></div>

        <h2 class="u5">Sunrise coffee hike</h2>
        <div class="muted u6">Sun, 07:00 · Cascade, Yerevan</div>

        <p class="u7">Easy morning walk with coffee at the top. Bring a thermos!</p>

        <div class="chip-row u8">
          <div class="chip">Pace: Moderate</div>
          <div class="chip">Group size: 6</div>
          <div class="chip">🚗 I can offer a ride (2)</div>
        </div>

        <!-- TODO: wire up button — Start hike --><button
          class="btn btn-primary u9"
          data-action="startHikeFromEvent('ev1')"
        >
          Start hike
        </button>
        <!-- TODO: wire up button — 💬 Group chat --><button
          class="btn btn-outline u10"
          data-action="openChat('eventDetail')"
        >
          💬 Group chat
        </button>
        <!-- TODO: wire up button — Remove --><button
          class="btn btn-outline u11"
          data-action="deletePlannedEvent('ev1'); showToast(t('eventDeleted')); goBack('home');"
        >
          Remove
        </button>
      </div>

      <div id="tabbar" class="tabbar">
        <!-- TODO: wire up button — 🏠Home --><button class="tab" data-action="go('home')">
          <span class="ic">🏠</span>Home
        </button>
        <!-- TODO: wire up button — 🧭Explore --><button class="tab" data-action="go('explore')">
          <span class="ic">🧭</span>Explore
        </button>
        <!-- TODO: wire up button — 🥾Routes --><button class="tab" data-action="goRoutesTab()">
          <span class="ic">🥾</span>Routes
        </button>
        <!-- TODO: wire up button — 💬Messages --><button class="tab" data-action="go('messages')">
          <span class="ic">💬</span>Messages
        </button>
        <!-- TODO: wire up button — 👤Profile --><button class="tab" data-action="go('profileMe')">
          <span class="ic">👤</span>Profile
        </button>
      </div>
    </div>
  </body>
</html>
