<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#C17A82" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Trailkin — Create account</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/pages/03-register.css" />
  </head>
  <body>
    <!-- Static export of the "Create account" screen. No JavaScript on purpose: every interactive element carries a data-action / data-on-input / data-on-change attribute holding the original prototype handler as a hint. Wire these up yourself. -->
    <div id="shell">
      <div id="topbar" class="topbar">
        <!-- TODO: wire up button — ← --><button class="back-btn" data-action="go('signIn')">←</button>
        <div class="lang-toggle">
          <!-- TODO: wire up button — EN --><button class="active" data-action="toggleLang('en')">EN</button
          ><!-- TODO: wire up button — RU --><button class="" data-action="toggleLang('ru')">RU</button>
        </div>
      </div>
      <div id="screen">
        <div class="u1">
          <div class="u2">🥾</div>
          <h2 class="u3">Create your account</h2>
          <p class="muted u4">Register with email in seconds.</p>
        </div>

        <!-- TODO: wire up button — Continue with Apple --><button
          class="btn u5"
          data-action="submitRegister()"
        >
          Continue with Apple
        </button>
        <!-- TODO: wire up button — G Continue with Google --><button
          class="btn btn-secondary u6"
          data-action="submitRegister()"
        >
          G Continue with Google
        </button>

        <div class="row u7">
          <div class="u8"></div>
          <span class="muted u9">or</span>
          <div class="u8"></div>
        </div>

        <div class="field-label">MOBILE PHONE</div>
        <input type="text" id="regPhone" placeholder="+1 (555) 000-0000" />
        <div class="field-label">EMAIL</div>
        <input type="text" id="regEmail" placeholder="you@example.com" />
        <div class="field-label">PASSWORD</div>
        <input type="text" id="regPassword" placeholder="Create a password" />

        <!-- TODO: wire up button — Create Account --><button
          class="btn btn-primary u10"
          data-action="submitRegister()"
        >
          Create Account
        </button>
        <p class="muted u11">By continuing you agree to the Terms and Privacy Policy.</p>
        <p class="u12">
          <span class="muted">Already have an account? </span>
          <span data-action="go('signIn')" class="u13">Sign In</span>
        </p>
      </div>
    </div>
  </body>
</html>
