<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#C17A82" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Trailkin — Событие</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/pages/18-event-detail.css" />
  </head>
  <body>
    <!-- Статический экспорт экрана «Событие». JavaScript намеренно не подключён: у каждого интерактивного элемента есть атрибут data-action / data-on-input / data-on-change с исходным обработчиком прототипа в качестве подсказки. Подключите их сами. -->
    <div id="shell">
      <div id="topbar" class="topbar">
        <!-- TODO: wire up button — ← --><button class="back-btn" data-action="goBack('home')">←</button
        ><span class="display u1">🥾 Trailkin</span><!-- TODO: wire up button — 🔔 --><button
          class="back-btn u2"
          aria-label="Уведомления"
          data-action="openNotifFeed()"
        >
          🔔
        </button>
      </div>
      <div id="screen">
        <div class="hero-img u3"><div class="display u4">🥾</div></div>

        <h2 class="u5">Рассветный кофе-хайк</h2>
        <div class="muted u6">Вс, 07:00 · Каскад, Ереван</div>

        <p class="u7">Лёгкая утренняя прогулка с кофе на вершине. Возьмите термос!</p>

        <div class="chip-row u8">
          <div class="chip">Темп: Средний</div>
          <div class="chip">Размер группы: 6</div>
          <div class="chip">🚗 Могу подвезти (2)</div>
        </div>

        <!-- TODO: wire up button — Начать поход --><button
          class="btn btn-primary u9"
          data-action="startHikeFromEvent('ev1')"
        >
          Начать поход
        </button>
        <!-- TODO: wire up button — 💬 Чат группы --><button
          class="btn btn-outline u10"
          data-action="openChat('eventDetail')"
        >
          💬 Чат группы
        </button>
        <!-- TODO: wire up button — Удалить --><button
          class="btn btn-outline u11"
          data-action="deletePlannedEvent('ev1'); showToast(t('eventDeleted')); goBack('home');"
        >
          Удалить
        </button>
      </div>

      <div id="tabbar" class="tabbar">
        <!-- TODO: wire up button — 🏠Главная --><button class="tab" data-action="go('home')">
          <span class="ic">🏠</span>Главная
        </button>
        <!-- TODO: wire up button — 🧭Открыть --><button class="tab" data-action="go('explore')">
          <span class="ic">🧭</span>Открыть
        </button>
        <!-- TODO: wire up button — 🥾Маршруты --><button class="tab" data-action="goRoutesTab()">
          <span class="ic">🥾</span>Маршруты
        </button>
        <!-- TODO: wire up button — 💬Сообщения --><button class="tab" data-action="go('messages')">
          <span class="ic">💬</span>Сообщения
        </button>
        <!-- TODO: wire up button — 👤Профиль --><button class="tab" data-action="go('profileMe')">
          <span class="ic">👤</span>Профиль
        </button>
      </div>
    </div>
  </body>
</html>
