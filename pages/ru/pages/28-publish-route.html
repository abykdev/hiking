<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#C17A82" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Trailkin — Публикация маршрута</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/pages/28-publish-route.css" />
  </head>
  <body>
    <!-- Статический экспорт экрана «Публикация маршрута». JavaScript намеренно не подключён: у каждого интерактивного элемента есть атрибут data-action / data-on-input / data-on-change с исходным обработчиком прототипа в качестве подсказки. Подключите их сами. -->
    <div id="shell">
      <div id="topbar" class="topbar">
        <!-- TODO: wire up button — ← --><button class="back-btn" data-action="goBack('recordRoute')">
          ←</button
        ><span class="display u1">🥾 Trailkin</span><!-- TODO: wire up button — 🔔 --><button
          class="back-btn u2"
          aria-label="Уведомления"
          data-action="openNotifFeed()"
        >
          🔔
        </button>
      </div>
      <div id="screen">
        <h2 class="u3">Сохрани маршрут</h2>

        <div class="u4">
          <svg width="100%" height="100%" viewBox="0 0 300 220">
            <path
              d="M20.0,200.0 L53.8,174.7 L72.0,146.3 L118.8,117.9 L173.4,102.1 L220.2,80.0 L243.6,45.3 L280.0,20.0"
              fill="none"
              stroke="#C17A82"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></path>
            <circle cx="20.0" cy="200.0" r="6" fill="#C9A6AE" stroke="#fff" stroke-width="2"></circle>
            <circle cx="280.0" cy="20.0" r="7" fill="#C17A82" stroke="#fff" stroke-width="2.5"></circle>
          </svg>
        </div>
        <div class="space-between u5">
          <div>
            <div class="muted u6">Дистанция</div>
            <div class="u7">1.09 km</div>
          </div>
          <div>
            <div class="muted u6">Длительность</div>
            <div class="u7">45 min</div>
          </div>
          <div>
            <div class="muted u6">GPS-точек</div>
            <div class="u7">8</div>
          </div>
        </div>

        <div class="field-label">Название маршрута</div>
        <input type="text" id="routeNameInput" placeholder="например, Моя утренняя петля" />
        <div class="field-label">Описание (необязательно)</div>
        <textarea id="routeDescInput" placeholder="Какой это маршрут?"></textarea>

        <div class="field-label">Видимость</div>
        <div class="chip-row">
          <div class="chip selected" data-vis="public" data-action="selectVisibility('public', this)">
            Публичный — видят все
          </div>
          <div class="chip" data-vis="private" data-action="selectVisibility('private', this)">
            Приватный — только ты
          </div>
        </div>

        <div class="u8">
          <!-- TODO: wire up button — Сохранить маршрут --><button
            class="btn btn-primary"
            data-action="submitPublishRoute()"
          >
            Сохранить маршрут
          </button>
        </div>
        <!-- TODO: wire up button — Удалить запись --><button
          class="btn btn-outline u5"
          data-action="discardRecordingRoute()"
        >
          Удалить запись
        </button>
      </div>

      <div id="tabbar" class="tabbar">
        <!-- TODO: wire up button — 🏠Главная --><button class="tab" data-action="go('home')">
          <span class="ic">🏠</span>Главная
        </button>
        <!-- TODO: wire up button — 🧭Открыть --><button class="tab" data-action="go('explore')">
          <span class="ic">🧭</span>Открыть
        </button>
        <!-- TODO: wire up button — 🥾Маршруты --><button class="tab" data-action="goRoutesTab()">
          <span class="ic">🥾</span>Маршруты
        </button>
        <!-- TODO: wire up button — 💬Сообщения --><button class="tab" data-action="go('messages')">
          <span class="ic">💬</span>Сообщения
        </button>
        <!-- TODO: wire up button — 👤Профиль --><button class="tab" data-action="go('profileMe')">
          <span class="ic">👤</span>Профиль
        </button>
      </div>
    </div>
  </body>
</html>
