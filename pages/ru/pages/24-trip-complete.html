<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#C17A82" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Trailkin — Поход завершён</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/pages/24-trip-complete.css" />
  </head>
  <body>
    <!-- Статический экспорт экрана «Поход завершён». JavaScript намеренно не подключён: у каждого интерактивного элемента есть атрибут data-action / data-on-input / data-on-change с исходным обработчиком прототипа в качестве подсказки. Подключите их сами. -->
    <div id="shell">
      <div id="topbar" class="topbar">
        <div class="u1"></div>
        <span class="display u2">🥾 Trailkin</span><!-- TODO: wire up button — 🔔 --><button
          class="back-btn u3"
          aria-label="Уведомления"
          data-action="openNotifFeed()"
        >
          🔔
        </button>
      </div>
      <div id="screen">
        <div class="u4">
          <h2 class="u5">Поход завершён! 🎉</h2>
          <p class="muted">Отличная работа — вот твоя сводка.</p>
        </div>

        <div class="section-title">Твой маршрут</div>

        <div class="u6">
          <svg width="100%" height="100%" viewBox="0 0 300 220">
            <path
              d="M280.0,200.0 L142.0,118.6 L20.0,20.0"
              fill="none"
              stroke="#C17A82"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></path>
            <circle cx="280.0" cy="200.0" r="6" fill="#C9A6AE" stroke="#fff" stroke-width="2"></circle>
            <circle cx="20.0" cy="20.0" r="7" fill="#C17A82" stroke="#fff" stroke-width="2.5"></circle>
          </svg>
        </div>

        <div class="card u7">
          <div class="space-between">
            <div>
              <div class="muted u8">Дистанция</div>
              <div class="u9">0.63 km</div>
            </div>
            <div>
              <div class="muted u8">Длительность</div>
              <div class="u9">95 min</div>
            </div>
          </div>
          <div class="space-between u10">
            <div>
              <div class="muted u8">Набор высоты</div>
              <div class="u9">+250 m</div>
            </div>
            <div>
              <div class="muted u8">Прим. шагов</div>
              <div class="u9">834</div>
            </div>
          </div>
        </div>

        <!-- TODO: wire up button — Продолжить --><button
          class="btn btn-primary u11"
          data-action="go('review')"
        >
          Продолжить
        </button>
      </div>

      <div id="tabbar" class="tabbar">
        <!-- TODO: wire up button — 🏠Главная --><button class="tab" data-action="go('home')">
          <span class="ic">🏠</span>Главная
        </button>
        <!-- TODO: wire up button — 🧭Открыть --><button class="tab" data-action="go('explore')">
          <span class="ic">🧭</span>Открыть
        </button>
        <!-- TODO: wire up button — 🥾Маршруты --><button class="tab" data-action="goRoutesTab()">
          <span class="ic">🥾</span>Маршруты
        </button>
        <!-- TODO: wire up button — 💬Сообщения --><button class="tab" data-action="go('messages')">
          <span class="ic">💬</span>Сообщения
        </button>
        <!-- TODO: wire up button — 👤Профиль --><button class="tab" data-action="go('profileMe')">
          <span class="ic">👤</span>Профиль
        </button>
      </div>
    </div>
  </body>
</html>
