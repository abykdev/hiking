<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#C17A82" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Trailkin — Отзыв</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/pages/25-review.css" />
  </head>
  <body>
    <!-- Статический экспорт экрана «Отзыв». JavaScript намеренно не подключён: у каждого интерактивного элемента есть атрибут data-action / data-on-input / data-on-change с исходным обработчиком прототипа в качестве подсказки. Подключите их сами. -->
    <div id="shell">
      <div id="topbar" class="topbar">
        <!-- TODO: wire up button — ← --><button class="back-btn" data-action="goBack('tripComplete')">
          ←</button
        ><span class="display u1">🥾 Trailkin</span><!-- TODO: wire up button — 🔔 --><button
          class="back-btn u2"
          aria-label="Уведомления"
          data-action="openNotifFeed()"
        >
          🔔
        </button>
      </div>
      <div id="screen">
        <h2 class="u3">Как прошёл поход?</h2>
        <div class="field-label">Состояние тропы</div>
        <div class="star-row">
          <span class="" data-action="setRating('trailRating',1)">★</span
          ><span class="" data-action="setRating('trailRating',2)">★</span
          ><span class="" data-action="setRating('trailRating',3)">★</span
          ><span class="" data-action="setRating('trailRating',4)">★</span
          ><span class="" data-action="setRating('trailRating',5)">★</span>
        </div>

        <div class="field-label">Комфорт в одиночном походе</div>
        <div class="star-row">
          <span class="" data-action="setRating('comfortRating',1)">★</span
          ><span class="" data-action="setRating('comfortRating',2)">★</span
          ><span class="" data-action="setRating('comfortRating',3)">★</span
          ><span class="" data-action="setRating('comfortRating',4)">★</span
          ><span class="" data-action="setRating('comfortRating',5)">★</span>
        </div>

        <div class="field-label">Отзыв о попутчицах</div>
        <div class="chip-row">
          <div class="chip" data-action="toggleCompTag(0)">Пунктуальность</div>
          <div class="chip" data-action="toggleCompTag(1)">Уважительность</div>
          <div class="chip" data-action="toggleCompTag(2)">Темп совпал</div>
          <div class="chip" data-action="toggleCompTag(3)">Подготовленность</div>
          <div class="chip" data-action="toggleCompTag(4)">Хорошая коммуникация</div>
        </div>

        <div class="field-label">Пошли бы снова вместе?</div>
        <div class="chip-row">
          <div class="chip" data-action="setAgain('yes')">Да</div>
          <div class="chip" data-action="setAgain('maybe')">Возможно</div>
          <div class="chip" data-action="setAgain('no')">Нет</div>
        </div>

        <div class="field-label">Добавь заметку об этом маршруте</div>
        <textarea
          placeholder="Как всё прошло? Что стоит запомнить…"
          data-on-input="updateNote(this.value)"
        ></textarea>

        <div class="field-label">Фото (необязательно)</div>

        <label class="upload-btn">
          📷 Добавить фото
          <input
            type="file"
            accept="image/*"
            multiple=""
            capture="environment"
            data-on-change="handlePhotoUpload(event)"
            class="u4"
          />
        </label>

        <div class="u5">
          <!-- TODO: wire up button — Отправить отзыв --><button
            class="btn btn-primary"
            data-action="submitReview()"
          >
            Отправить отзыв
          </button>
        </div>
      </div>

      <div id="tabbar" class="tabbar">
        <!-- TODO: wire up button — 🏠Главная --><button class="tab" data-action="go('home')">
          <span class="ic">🏠</span>Главная
        </button>
        <!-- TODO: wire up button — 🧭Открыть --><button class="tab" data-action="go('explore')">
          <span class="ic">🧭</span>Открыть
        </button>
        <!-- TODO: wire up button — 🥾Маршруты --><button class="tab" data-action="goRoutesTab()">
          <span class="ic">🥾</span>Маршруты
        </button>
        <!-- TODO: wire up button — 💬Сообщения --><button class="tab" data-action="go('messages')">
          <span class="ic">💬</span>Сообщения
        </button>
        <!-- TODO: wire up button — 👤Профиль --><button class="tab" data-action="go('profileMe')">
          <span class="ic">👤</span>Профиль
        </button>
      </div>
    </div>
  </body>
</html>
