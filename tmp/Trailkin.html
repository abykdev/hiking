<style>
  :root {
    /* Warm, soft "feminine" palette — dusty rose primary, blush surfaces,
       a muted sage kept only as a small secondary accent so it still reads
       as an outdoors app rather than a straight beauty/dating-app pink. */
    --forest: #C17A82;       /* primary actions, active states — dusty rose */
    --forest-deep: #9C5C64;  /* pressed/dark accent — deeper rose */
    --charcoal: #4A3236;     /* primary text — warm plum-brown, not pure black */
    --off-white: #FFF8F5;    /* primary background — soft cream */
    --sand: #F7E4DF;         /* secondary surface / cards — blush */
    --stone: #B08A8C;        /* secondary text, borders — muted mauve */
    --sage: #C9A6AE;         /* secondary accent, tags, badges — dusty pink-mauve */
    --alert: #D1495B;        /* SOS / destructive only */
    --bg: var(--off-white);
    --surface: #FFFFFF;
    --text: var(--charcoal);
    --text-muted: #8A6A6D;
    --radius: 16px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      /* Kept light even in system dark mode — the "cute" palette reads much
         better on a pale background than a dark one, so the app no longer
         switches to a dark surface on phones set to dark mode. */
      --bg: #FFF8F5;
      --surface: #FFFFFF;
      --text: #4A3236;
      --text-muted: #8A6A6D;
      --sand: #F7E4DF;
      --stone: #B08A8C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #FFF8F5;
    --surface: #FFFFFF;
    --text: #4A3236;
    --text-muted: #8A6A6D;
    --sand: #F7E4DF;
    --stone: #B08A8C;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  #shell {
    max-width: 460px;
    margin: 0 auto;
    height: 100dvh;
    height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  #screen { flex: 1 1 auto; min-height: 0; padding: 20px 20px 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px 4px;
  }
  .back-btn {
    background: none; border: none; color: var(--text); font-size: 20px;
    cursor: pointer; padding: 4px 8px; border-radius: 8px;
  }
  .lang-toggle {
    display: flex; background: var(--sand); border-radius: 20px; padding: 3px;
    font-size: 12px; font-weight: 600;
  }
  .lang-toggle button {
    border: none; background: none; padding: 5px 12px; border-radius: 16px;
    cursor: pointer; color: var(--text-muted); font-family: inherit; font-weight: 600;
  }
  .lang-toggle button.active { background: var(--forest); color: #fff; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: 12px; padding: 14px 20px; font-size: 15px;
    font-weight: 600; cursor: pointer; font-family: inherit; width: 100%;
    transition: transform .08s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--forest); color: #fff; }
  .btn-secondary { background: var(--sand); color: var(--text); }
  .btn-outline { background: transparent; color: var(--forest); border: 1.5px solid var(--forest); }
  .btn-alert { background: var(--alert); color: #fff; }
  .btn-sm { padding: 9px 14px; font-size: 13px; width: auto; }

  .card {
    background: var(--surface); border-radius: var(--radius); padding: 16px;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px;
    border-radius: 20px; background: var(--sand); color: var(--text);
    font-size: 13.5px; font-weight: 500; cursor: pointer; border: 1.5px solid transparent;
    margin: 0 8px 8px 0;
  }
  .chip.selected { border-color: var(--forest); background: var(--forest); color: #fff; }
  .chip-row { display: flex; flex-wrap: wrap; }
  .field-label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin: 18px 0 8px; text-transform: none; }
  input[type=text], textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--sand);
    background: var(--surface); color: var(--text); font-family: inherit; font-size: 15px;
  }
  textarea { resize: none; min-height: 64px; }

  .tabbar {
    flex: 0 0 auto;
    display: flex; flex-direction: row; flex-wrap: nowrap; align-items: stretch;
    border-top: 1px solid rgba(0,0,0,0.08); background: var(--surface);
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .tab {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; font-family: inherit; cursor: pointer;
    color: var(--text-muted); font-size: 10.5px; font-weight: 600; padding: 4px 2px;
    white-space: nowrap;
  }
  .tab.active { color: var(--forest); }
  .tab .ic { font-size: 19px; }
  #topbar.topbar { flex: 0 0 auto; }
  #activebar { flex: 0 0 auto; }

  .active-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--forest); color: #fff; padding: 10px 16px; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .active-bar .pulse {
    width: 8px; height: 8px; border-radius: 50%; background: #9BE39B;
    display: inline-block; margin-right: 8px; animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--sage);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    color: #fff; font-size: 13px; flex-shrink: 0;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .space-between { display: flex; align-items: center; justify-content: space-between; }
  .muted { color: var(--text-muted); font-size: 13px; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 8px; background: var(--sage); color: #fff; }
  .divider { height: 1px; background: rgba(0,0,0,0.07); margin: 14px 0; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); margin: 22px 0 10px; }
  .hero-img {
    height: 150px; border-radius: var(--radius); background: linear-gradient(135deg, var(--forest) 0%, var(--sage) 100%);
    display: flex; align-items: flex-end; padding: 14px; color: #fff; position: relative; overflow: hidden;
  }
  .compat-badge {
    background: var(--forest); color: #fff; font-weight: 700; font-size: 13px;
    padding: 6px 12px; border-radius: 10px; display: inline-block;
  }
  .progress-track { height: 6px; background: var(--sand); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--forest); }
  .msg { background: var(--sand); border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; font-size: 14px; max-width: 80%; }
  .msg.me { background: var(--forest); color: #fff; margin-left: auto; }
  .star-row span { font-size: 26px; cursor: pointer; margin-right: 4px; color: var(--stone); }
  .star-row span.filled { color: var(--forest); }
  .avatar.clickable { cursor: pointer; }
  .offline-tag {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700;

function toRad(d){ return d*Math.PI/180; }
function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371, dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function difficultyLabel(diff){
  const map = { en:{easy:'Easy',moderate:'Moderate',hard:'Hard'}, ru:{easy:'Лёгкая',moderate:'Средняя',hard:'Сложная'} };
  return map[state.lang][diff];
}

// ---------- RouteService: nearest-point / progress / off-route math ----------
// Unit-tested standalone before integration (10/10 passing) — see project notes.
// Uses a local equirectangular projection, valid at hiking scale (a few tens of km).
function ptXY(p, ref) {
  const R = 6371000;
  return { x: toRad(p.lng-ref.lng)*Math.cos(toRad(ref.lat))*R, y: toRad(p.lat-ref.lat)*R };
}
function cumulativeDistances(route) {
  const cum = [0];
  for (let i=1;i<route.length;i++) cum.push(cum[i-1] + haversineKm(route[i-1].lat,route[i-1].lng,route[i].lat,route[i].lng));
  return cum;
}
function nearestOnSegment(p, a, b) {
  const P=ptXY(p,a), A=ptXY(a,a), B=ptXY(b,a);
  const ABx=B.x-A.x, ABy=B.y-A.y, len2=ABx*ABx+ABy*ABy;
  let t = len2===0 ? 0 : ((P.x-A.x)*ABx+(P.y-A.y)*ABy)/len2;
  t = Math.max(0, Math.min(1, t));
  const Cx=A.x+t*ABx, Cy=A.y+t*ABy, dx=P.x-Cx, dy=P.y-Cy;
  return { t, distanceKm: Math.sqrt(dx*dx+dy*dy)/1000 };
}
// Returns null for routes with fewer than 2 points — caller must show an
// explicit "no route geometry" state rather than fabricate a straight line.
function nearestOnRoute(p, route) {
  if (!route || route.length < 2) return null;
  const cum = cumulativeDistances(route);
  const totalRouteKm = cum[cum.length-1];
  let best = null;
  for (let i=0;i<route.length-1;i++) {
    const seg = nearestOnSegment(p, route[i], route[i+1]);
    const alongKm = cum[i] + seg.t * (cum[i+1]-cum[i]);
    if (!best || seg.distanceKm < best.distanceKm) best = { t:seg.t, distanceKm:seg.distanceKm, distanceAlongRouteKm:alongKm, totalRouteKm };
  }
  return best;
}
// 50m default off-route threshold: wide enough for normal consumer-GPS noise
// (5-15m open sky, worse in gorges/tree cover), narrow enough to catch a real wrong turn.
function isOffRoute(p, route, thresholdKm=0.05) {
  const n = nearestOnRoute(p, route);
  return n ? n.distanceKm > thresholdKm : false;
}
// GPS-accuracy filtering + monotonic progress (never regress from noise, but
// allow a small grace margin so a genuine backtrack isn't hidden forever).
function createProgressTracker(accuracyThresholdM=30, graceMarginKm=0.03) {
  let maxAlongKm = 0;
  return {
    update(fix, route) {
      if (fix.accuracy != null && fix.accuracy > accuracyThresholdM)
        return { accepted:false, reason:'low_accuracy', distanceTravelledKm:maxAlongKm };
      const n = nearestOnRoute(fix, route);
      if (!n) return { accepted:false, reason:'no_route_geometry', distanceTravelledKm:maxAlongKm };
      if (n.distanceAlongRouteKm >= maxAlongKm - graceMarginKm) maxAlongKm = Math.max(maxAlongKm, n.distanceAlongRouteKm);
      return {
        accepted:true, distanceTravelledKm:maxAlongKm,
        remainingKm: Math.max(0, n.totalRouteKm - maxAlongKm),
        progress: n.totalRouteKm ? maxAlongKm/n.totalRouteKm : 0,
        offRoute: n.distanceKm > 0.05, perpendicularDistanceKm: n.distanceKm,
      };
    },
    reset() { maxAlongKm = 0; },
    setProgress(km) { maxAlongKm = km; },
  };
}

// Ephemeral (never persisted) — real device location for this session only,
// consistent with the app's own safety model: location is temporary, not stored.
let userLocation = null;
let locationStatus = 'idle'; // idle | requesting | granted | denied | unsupported

function requestLocation() {
  if (!('geolocation' in navigator)) { locationStatus = 'unsupported'; render(); return; }
  locationStatus = 'requesting'; render();
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
      locationStatus = 'granted';
      applyFixToSession(userLocation);
      render();
    },
    err => { locationStatus = 'denied'; render(); },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}
function mapsHref(lat, lng, label) {
  return `https://maps.apple.com/?ll=${lat},${lng}&q=${encodeURIComponent(label||'Trailhead')}`;
}

  state.hikeSession = {
    id: 'hs_' + Date.now(), trailId, status: 'active',
    startedAt: Date.now(), accumulatedPauseMs: 0, pausedAt: null, finishedAt: null,
    distanceTravelledKm: 0, offRoute: false, lastAccuracyM: null,
    points: [], // real recorded GPS points along the way — used for the trip-complete map
  };
  progressTracker = createProgressTracker();
  save();
}
function pauseHikeSession() {
  if (!state.hikeSession || state.hikeSession.status !== 'active') return;
  state.hikeSession.status = 'paused';
  state.hikeSession.pausedAt = Date.now();
  save(); render();
}
function resumeHikeSession() {
  if (!state.hikeSession || state.hikeSession.status !== 'paused') return;
  state.hikeSession.accumulatedPauseMs += Date.now() - state.hikeSession.pausedAt;
  state.hikeSession.pausedAt = null;
  state.hikeSession.status = 'active';
  save(); render();
}
function elapsedMsForSession(s) {
  if (!s) return 0;
  const pauseMs = s.accumulatedPauseMs + (s.status === 'paused' && s.pausedAt ? Date.now() - s.pausedAt : 0);
  const end = s.finishedAt || Date.now();
  return Math.max(0, end - s.startedAt - pauseMs);
}
// Applies one location fix to the active session's progress tracker.
// No-ops safely if the trail has no route geometry, per the error-handling spec —
// distance-travelled and off-route just stay unavailable rather than being faked.
function applyFixToSession(fix) {
  const s = state.hikeSession;
  if (!s || s.status !== 'active') return;
  s.lastAccuracyM = fix.accuracy != null ? Math.round(fix.accuracy) : null;
  // Record the real point regardless of whether we have curated route geometry —
  // this is what the trip-complete map is drawn from afterwards.
  if (fix.accuracy == null || fix.accuracy <= 50) {
    if (!s.points) s.points = [];
    s.points.push({ lat: fix.lat, lng: fix.lng });
  }
  const trail = trailForSession(s);
  if (trail && trail.routeGeometry) {
    if (!progressTracker) progressTracker = createProgressTracker();
    const r = progressTracker.update(fix, trail.routeGeometry);
    if (r.accepted) {
      s.distanceTravelledKm = r.distanceTravelledKm;
      s.offRoute = r.offRoute;
    }
  }
  save();
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);

  } catch (e) { console.warn('storage read failed', e); }
  return defaultState();
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { console.warn('storage write failed', e); }
}

// Replaces window.showToast()/confirm(): those native dialogs are unreliable
// inside a sandboxed preview iframe — some hosts block them outright, in
// which case the call silently returns without ever showing anything,
// which is exactly what made the Finish button look broken. This toast is
// a plain DOM element under our own control, so it always works.
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ---------- Navigation-mode map rendering (SVG vector route — see note below) ----------
// NOTE: this renders the route geometry as vector art, not live map tiles.
// Real basemap tiles (satellite/street imagery) require fetching image tiles
// from a map provider at render time; a published page's content-security
// policy only allows script/font files from a fixed host list, not arbitrary
// tile image requests, so no live-tile provider can load here. The
// coordinates and math driving this view are real — the picture under them
// is schematic, and is labeled as such in the UI rather than presented as a
// live map.
let mapViewMode = 'fit'; // 'fit' | 'me'
let trustedContactsReturn = 'safetyCheck'; // where the "trustedContacts" screen's back button goes
function goToTrustedContacts(from) { trustedContactsReturn = from; go('trustedContacts'); }
function setMapView(mode) { mapViewMode = mode; if (mode==='me' && locationStatus==='idle') requestLocation(); else render(); }

function routeBounds(route) {
  const lats = route.map(p=>p.lat), lngs = route.map(p=>p.lng);
  return { minLat:Math.min(...lats), maxLat:Math.max(...lats), minLng:Math.min(...lngs), maxLng:Math.max(...lngs) };
}
function projectSvg(p, b, w, h, pad) {
  const spanLat = Math.max(b.maxLat-b.minLat, 0.0005), spanLng = Math.max(b.maxLng-b.minLng, 0.0005);
  const x = pad + ((p.lng-b.minLng)/spanLng) * (w-2*pad);
  const y = h - pad - ((p.lat-b.minLat)/spanLat) * (h-2*pad); // flip: north = up
  return { x, y };
}
function renderNavMap(trail) {
  const W=300, H=240, pad=22;
  if (!trail.routeGeometry) {
    return `
      <div style="height:${H}px; border-radius:var(--radius); background:var(--sand); display:flex; align-items:center; justify-content:center; text-align:center; padding:20px;">
        <div class="muted" style="font-size:13px;">${t('noRouteGeometry')}</div>
      </div>`;
  }
  let bounds;
  if (mapViewMode === 'me' && userLocation) {
    const span = 0.01; // ~1km window centered on the hiker
    bounds = { minLat:userLocation.lat-span, maxLat:userLocation.lat+span, minLng:userLocation.lng-span, maxLng:userLocation.lng+span };
  } else {
    bounds = routeBounds(trail.routeGeometry);
  }
  const pts = trail.routeGeometry.map(p => projectSvg(p, bounds, W, H, pad));
  const pathD = pts.map((p,i) => (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const start = pts[0], finish = pts[pts.length-1];
  let userMarker = '';
  if (userLocation) {
    const up = projectSvg(userLocation, bounds, W, H, pad);
    if (up.x >= -10 && up.x <= W+10 && up.y >= -10 && up.y <= H+10) {
      userMarker = `<circle cx="${up.x.toFixed(1)}" cy="${up.y.toFixed(1)}" r="9" fill="rgba(193,122,130,0.22)"/><circle cx="${up.x.toFixed(1)}" cy="${up.y.toFixed(1)}" r="5.5" fill="#C17A82" stroke="#fff" stroke-width="2"/>`;
    }
  }
  return `
    <div style="height:${H}px; border-radius:var(--radius); background:var(--sand); overflow:hidden;">
      <svg width="100%" height="100%" viewBox="0 0 ${W} ${H}">
        <path d="${pathD}" fill="none" stroke="#C17A82" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${start.x.toFixed(1)}" cy="${start.y.toFixed(1)}" r="6" fill="#C9A6AE" stroke="#fff" stroke-width="2"/>
        <circle cx="${finish.x.toFixed(1)}" cy="${finish.y.toFixed(1)}" r="6" fill="#D1495B" stroke="#fff" stroke-width="2"/>
        ${userMarker}
      </svg>
    </div>`;
}

// ---------- Route recording (Strava-style: build your own route live via GPS) ----------
// Ephemeral (not persisted mid-recording) — an interrupted recording is lost,
// same honest limitation as any other in-page GPS state in this prototype.
let recording = { active:false, paused:false, points:[], startedAt:null, pausedMs:0, pausedAt:null };
let recordWatchId = null;

function startRecordingRoute() {
  recording = { active:true, paused:false, points:[], startedAt:Date.now(), pausedMs:0, pausedAt:null };
  if (!('geolocation' in navigator)) { locationStatus='unsupported'; render(); return; }
  recordWatchId = navigator.geolocation.watchPosition(
    pos => {
      const fix = { lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:pos.coords.accuracy };
      userLocation = fix; locationStatus = 'granted';
      // Skip clearly noisy fixes so a bad GPS jump doesn't inflate distance —
      // same accuracy-gating principle as HikeSession tracking.
      if (fix.accuracy == null || fix.accuracy <= 50) recording.points.push({ lat:fix.lat, lng:fix.lng });
      if (state.screen === 'recordRoute') render();
    },
    err => { locationStatus = 'denied'; render(); },
    { enableHighAccuracy:true, maximumAge:4000 }
  );
  render();
}
function pauseRecordingRoute() {
  if (!recording.active) return;
  recording.paused = true; recording.pausedAt = Date.now();
  if (recordWatchId != null) { navigator.geolocation.clearWatch(recordWatchId); recordWatchId = null; }
  render();
}
function resumeRecordingRoute() {
  if (!recording.active || !recording.paused) return;
  recording.pausedMs += Date.now() - recording.pausedAt;
  recording.paused = false; recording.pausedAt = null;
  recordWatchId = navigator.geolocation.watchPosition(
    pos => {
      const fix = { lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:pos.coords.accuracy };
      userLocation = fix;
      if (fix.accuracy == null || fix.accuracy <= 50) recording.points.push({ lat:fix.lat, lng:fix.lng });
      if (state.screen === 'recordRoute') render();
    },
    err => { locationStatus = 'denied'; render(); },
    { enableHighAccuracy:true, maximumAge:4000 }
  );
  render();
}
function finishRecordingRoute() {
  if (recordWatchId != null) { navigator.geolocation.clearWatch(recordWatchId); recordWatchId = null; }
  recording.active = false;
  if (recording.points.length < 2) { showToast(t('minPointsWarning')); discardRecordingRoute(); return; }
  go('publishRoute');
}
function discardRecordingRoute() {
  if (recordWatchId != null) { navigator.geolocation.clearWatch(recordWatchId); recordWatchId = null; }
  recording = { active:false, paused:false, points:[], startedAt:null, pausedMs:0, pausedAt:null };
  go('hikes');
}
function recordingDistanceKm() {
  let d = 0;
  for (let i=1;i<recording.points.length;i++) d += haversineKm(recording.points[i-1].lat, recording.points[i-1].lng, recording.points[i].lat, recording.points[i].lng);
  return d;
}
function recordingElapsedMs() {
  if (!recording.startedAt) return 0;
  const pausedNow = recording.paused && recording.pausedAt ? Date.now()-recording.pausedAt : 0;
  return Math.max(0, Date.now() - recording.startedAt - recording.pausedMs - pausedNow);
}
function renderLiveTrack(points) {
  const W=300, H=220, pad=20;
  if (points.length < 2) {
    return `<div style="height:${H}px; border-radius:var(--radius); background:var(--sand); display:flex; align-items:center; justify-content:center;"><div class="muted" style="font-size:13px;">${state.lang==='ru'?'Жду GPS-сигнал…':'Waiting for GPS signal…'}</div></div>`;
  }
  const bounds = routeBounds(points);
  const pts = points.map(p => projectSvg(p, bounds, W, H, pad));
  const pathD = pts.map((p,i) => (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  return `
    <div style="height:${H}px; border-radius:var(--radius); background:var(--sand); overflow:hidden;">
      <svg width="100%" height="100%" viewBox="0 0 ${W} ${H}">
        <path d="${pathD}" fill="none" stroke="#C17A82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${pts[0].x.toFixed(1)}" cy="${pts[0].y.toFixed(1)}" r="6" fill="#C9A6AE" stroke="#fff" stroke-width="2"/>
        <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="7" fill="#C17A82" stroke="#fff" stroke-width="2.5"/>
      </svg>
    </div>`;
}

function screenRecordRoute() {
  const distKm = recordingDistanceKm();
  const elapsedMin = Math.floor(recordingElapsedMs()/60000);
  const elapsedSec = Math.floor((recordingElapsedMs()%60000)/1000);
  if (!recording.startedAt) {
    return `
      <h2 style="font-size:22px;">${t('recordRoute')}</h2>
      <p class="muted">${t('recordRouteSub')}</p>
      ${renderLiveTrack([])}
      <button class="btn btn-primary" style="margin-top:16px;" onclick="startRecordingRoute()">${t('startRecording')}</button>
    `;
  }
  return `
    <div class="space-between">
      <h2 style="font-size:20px;">${t('recordRoute')}</h2>
      <span class="row" style="gap:6px;"><span class="pulse" style="width:8px;height:8px;border-radius:50%;background:${recording.paused?'#B08A8C':'#C17A82'}; display:inline-block;"></span><strong style="font-size:12.5px;">${recording.paused ? t('pauseRecording') : t('recording')}</strong></span>
    </div>
    ${renderLiveTrack(recording.points)}
    <div class="space-between" style="margin-top:12px;">

  const elapsedMin = Math.round(elapsedMsForSession(s) / 60000);
  const showPingReminder = state.autoPingEnabled && elapsedMin > 0 && elapsedMin % 30 === 0;

  const hasRoute = !!(trail && trail.routeGeometry);
  const distTravelled = hasRoute ? s.distanceTravelledKm.toFixed(1) : '—';
  const distRemaining = hasRoute ? Math.max(0, trail.distance - s.distanceTravelledKm).toFixed(1) : '—';

    </div>
    <p class="muted" style="font-size:11px; margin-top:4px;">${t('tileNote')}</p>

    ${hasRoute ? `

    <div class="space-between" style="margin-top:10px;">

      <div><div class="muted" style="font-size:11px;">${t('remainingDistance')}</div><div style="font-weight:700;">${distRemaining} km</div></div>
      <div><div class="muted" style="font-size:11px;">${t('elapsedTime')}</div><div style="font-weight:700;">${elapsedMin} min</div></div>
    </div>` : `
    <div class="space-between" style="margin-top:12px;">
      <div><div class="muted" style="font-size:11px;">${t('elapsedTime')}</div><div style="font-weight:700;">${elapsedMin} min</div></div>
    </div>`}

    <p class="muted" style="font-size:11.5px; margin-top:10px;">📍 ${locLine}</p>
    <p class="muted" style="font-size:11.5px; margin-top:2px;">${state.trustedContact ? '✓ ' + t('startedTrip') : ''}</p>

    <div class="row" style="margin-top:14px; gap:10px;">
      ${s.status === 'active'
        ? `<button class="btn btn-secondary" style="flex:1;" onclick="pauseHikeSession()">${t('pause')}</button>`
        : `<button class="btn btn-secondary" style="flex:1;" onclick="resumeHikeSession()">${t('resume')}</button>`}
      <button class="btn btn-alert" style="flex:1;" onclick="go('sos')">${t('sos')}</button>
    </div>

    </div>
    ${showFinishConfirm ? `
    <div class="inline-confirm">
      <p style="margin:0 0 10px; font-weight:600;">${t('confirmFinish')}</p>
      <div class="row" style="gap:10px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="cancelFinishHike()">${state.lang==='ru'?'Отмена':'Cancel'}</button>
        <button class="btn btn-primary" style="flex:1;" onclick="doFinishHike()">${state.lang==='ru'?'Да, завершить':'Yes, finish'}</button>
      </div>

    <div class="toggle-row">
      <span style="font-size:13.5px;">${t('autoPing')}</span>
      <div class="switch ${state.autoPingEnabled?'on':''}" onclick="togglePingSetting()"><div class="knob"></div></div>
    </div>

    ${showPingReminder ? `
    <div class="ping-card">
      <strong>${t('pingReminder')}</strong>
      <a class="sms-link" href="${smsHref()}" onclick="logPing()">${t('sendSmsUpdate')}</a>
    </div>` : `

    `}

        <button class="btn btn-primary" onclick="checkin('safe')">${t('imBack')}</button>
        <button class="btn btn-secondary" onclick="checkin('time')">${t('needTime')}</button>

let showFinishConfirm = false;
function confirmFinishHike() { showFinishConfirm = true; render(); }
function cancelFinishHike() { showFinishConfirm = false; render(); }
function doFinishHike() { showFinishConfirm = false; checkin('safe'); }
function checkin(resp) {
  if (!state.hikeSession) return;
  if (resp === 'safe') {
    state.hikeSession.status = 'finished';
    state.hikeSession.finishedAt = Date.now();
    state.completedHikes += 1;
    if (!state.badges.includes('first_hike')) state.badges.push('first_hike');
    save();
    go('tripComplete');
  } else if (resp === 'time') {
    showToast(state.lang==='ru' ? 'Время продлено на 30 минут.' : 'Extended your window by 30 minutes.');
  } else {
    go('sos');
  }
}

function screenTripComplete() {
  const s = state.hikeSession;
  const points = (s && s.points) || [];
  const trail = s ? trailForSession(s) : null;
  let distanceKm = s ? s.distanceTravelledKm : 0;
  if ((!distanceKm || distanceKm === 0) && points.length >= 2) {
    for (let i = 1; i < points.length; i++) distanceKm += haversineKm(points[i-1].lat, points[i-1].lng, points[i].lat, points[i].lng);
  }
  const durationMin = s ? Math.round(elapsedMsForSession(s) / 60000) : 0;
  const estimatedSteps = Math.round((distanceKm * 1000) / 0.75); // ~0.75 m average stride — a rough estimate, not measured
  return `
    <div style="text-align:center; margin-top:6px;">
      <h2 style="font-size:24px;">${t('tripCompleteTitle')}</h2>
      <p class="muted">${t('tripCompleteSub')}</p>
    </div>

    <div class="section-title">${t('traveledMap')}</div>
    ${points.length >= 2
      ? renderLiveTrack(points)
      : `<div class="card"><p class="muted" style="margin:0;">${t('noTraveledRoute')}</p></div>`}

    <div class="card" style="margin-top:16px;">
      <div class="space-between">
        <div><div class="muted" style="font-size:11px;">${t('statDistance')}</div><div style="font-weight:700; font-size:16px;">${distanceKm.toFixed(2)} km</div></div>
        <div><div class="muted" style="font-size:11px;">${t('statDuration')}</div><div style="font-weight:700; font-size:16px;">${durationMin} min</div></div>
      </div>
      <div class="space-between" style="margin-top:14px;">
        <div><div class="muted" style="font-size:11px;">${t('statElevation')}</div><div style="font-weight:700; font-size:16px;">${trail ? '+' + trail.elevation + ' m' : '—'}</div></div>
        <div><div class="muted" style="font-size:11px;">${t('statSteps')}</div><div style="font-weight:700; font-size:16px;">${estimatedSteps.toLocaleString()}</div></div>

}

      ${userLocation ? `<a class="btn btn-outline" style="text-decoration:none; text-align:center;" href="${mapsHref(userLocation.lat, userLocation.lng, 'My location')}" target="_blank" rel="noopener">${t('shareLocation')}</a>` : `<button class="btn btn-outline" onclick="requestLocation()">${t('shareLocation')}</button>`}

function copyCoords() {
  if (!userLocation) { requestLocation(); return; }
  const text = `${userLocation.lat.toFixed(5)}, ${userLocation.lng.toFixed(5)}`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(()=>showToast(state.lang==='ru'?'Координаты скопированы':'Coordinates copied')).catch(()=>showToast(text));
  } else { showToast(text); }
}

function setRating(field, val) { state.review[field] = val; save(); render(); }
function toggleCompTag(i) {
  const arr = state.review.companionTags; const idx = arr.indexOf(i);
  if (idx > -1) arr.splice(idx,1); else arr.push(i);
  save(); render();
}
function setAgain(v) { state.review.hikeAgain = v; save(); render(); }
function submitReview() {
  const h = SAMPLE_HIKE;
  const r = state.review;
  state.routeHistory.unshift({
    id: Date.now(),
    trailName: h.trailName, trailNameRu: h.trailNameRu,
    date: new Date().toISOString().slice(0,10),
    distance: h.distance, elevation: h.elevation,
    rating: r.trailRating, note: r.note, photos: r.photos.slice(),
  });
  if (!state.trailReviews.h1) state.trailReviews.h1 = [];
  state.trailReviews.h1.unshift({
    trailRating: r.trailRating, comfortRating: r.comfortRating,
    note: r.note, photos: r.photos.slice(),
  });
  showToast(t('reviewDone'));
  state.hikeStatus = 'none';
  state.hikeSession = null;
  progressTracker = null;
  mapViewMode = 'fit';
  state.review = { trailRating: 0, comfortRating: 0, companionTags: [], hikeAgain: null, note: '', photos: [] };
  save();
  setTab('home');
}

let exploreSortMode = null; // null | 'easy' | 'challenge'
function goExploreSorted(mode) { exploreSortMode = mode; go('explore'); }
function clearExploreSort() { exploreSortMode = null; render(); }
function sortedExploreTrails() {
  if (exploreSortMode === 'easy') return TRAILS.filter(t => t.difficulty === 'easy');
  if (exploreSortMode === 'challenge') {
    const order = { moderate: 0, hard: 1, easy: 2 };
    return TRAILS.filter(t => t.difficulty !== 'easy').sort((a,b) => order[a.difficulty]-order[b.difficulty]);
  }
  return TRAILS;
}

    </div>

    ${state.myRoutes.filter(r => r.visibility === 'public').length === 0
      ? `<p class="muted">${t('noCommunityRoutes')}</p>`
      : state.myRoutes.filter(r => r.visibility === 'public').map(r => `
        <div class="card clickable" style="margin-bottom:10px; cursor:pointer;" onclick="openRouteDescription('${r.id}')">
          ${renderLiveTrack(r.points)}
          <div class="space-between" style="margin-top:8px;">
            <div style="font-weight:600; font-size:14.5px;">${escapeHtml(r.name)}</div>
            <span class="tag">${t('recordedByUser')}</span>
          </div>
          <div class="muted" style="font-size:12.5px; margin-top:4px;">${r.distanceKm.toFixed(2)} km · ${r.durationMin} min</div>
          ${r.description ? `<div class="muted" style="font-size:12.5px; margin-top:4px;">${escapeHtml(r.description)}</div>` : ''}
          <button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="event.stopPropagation(); openRouteDescription('${r.id}')">${t('addRoute')}</button>
        </div>`).join('')}
  `;
}
function openTrail(id) { state.viewingTrailId = id; go('trailDetail'); }

function screenTrailDetail() {
  const tr = TRAILS.find(x => x.id === state.viewingTrailId) || TRAILS[0];
  const name = state.lang==='ru' ? tr.nameRu : tr.name;
  const region = state.lang==='ru' ? tr.regionRu : tr.region;
  const desc = state.lang==='ru' ? tr.descRu : tr.desc;
  const dist = userLocation ? haversineKm(userLocation.lat, userLocation.lng, tr.lat, tr.lng).toFixed(0) : null;
  const interest = state.trailInterest[tr.id] || 0;
  return `
    <div class="hero-img" style="height:160px;">
      <div>
        <div class="display" style="font-size:20px;">${name}</div>
        <div style="font-size:13px; opacity:.9;">${region}</div>
      </div>
    </div>
    <div class="space-between" style="margin-top:16px;">
      <div><div class="muted">${state.lang==='ru'?'Дистанция':'Distance'}</div><div style="font-weight:700;">${tr.distance} km</div></div>
      <div><div class="muted">${t('elevation')}</div><div style="font-weight:700;">+${tr.elevation} m</div></div>
      <div><div class="muted">${t('duration')}</div><div style="font-weight:700;">${tr.duration}</div></div>
    </div>
    <div class="section-title">${t('routeMapTitle')}</div>
    ${renderNavMap(tr)}
    <div class="row" style="margin-top:8px; gap:8px;">
      <button class="btn btn-outline btn-sm" style="flex:1;" onclick="setMapView('me')">${t('centerOnMe')}</button>
      <button class="btn btn-outline btn-sm" style="flex:1;" onclick="setMapView('fit')">${t('fitRoute')}</button>
    </div>
    <p class="muted" style="font-size:11px; margin-top:4px;">${t('tileNote')}${dist ? ' · ' + dist + ' km ' + (state.lang==='ru'?'от тебя':'away') : ''}</p>

    <p style="font-size:14px; line-height:1.5; margin-top:14px;">${desc}</p>

    <div class="card" style="margin-top:6px;">
      ${!dist ? `<button class="btn btn-outline btn-sm" onclick="requestLocation()">${state.lang==='ru'?'Показать расстояние от меня':'Show distance from me'}</button>` : ''}
      <a class="sms-link" style="margin-top:${dist?'0':'10px'};" href="${mapsHref(tr.lat, tr.lng, name)}" target="_blank" rel="noopener">${state.lang==='ru'?'Открыть в Картах':'Open in Maps'}</a>
      <details style="margin-top:10px;"><summary class="muted" style="font-size:12px; cursor:pointer;">${state.lang==='ru'?'Координаты старта':'Trailhead coordinates'}</summary><div style="font-family:monospace; font-size:12px; margin-top:4px;">${tr.lat.toFixed(4)}, ${tr.lng.toFixed(4)}</div></details>
    </div>

    <button class="btn btn-outline" style="margin-top:14px;" onclick="toggleOffline('${tr.id}')">${state.offlineTrails[tr.id] ? '✓ ' + t('offlineOn') : t('makeOffline')}</button>
    ${state.offlineTrails[tr.id] ? `<p class="muted" style="font-size:12px; margin-top:6px;">${t('offlineTilesNote')}</p>` : ''}

    <div class="card" style="margin-top:16px; text-align:center;">
      <div style="font-size:13.5px; margin-bottom:10px;">${state.lang==='ru'?`${interest} женщин(ы) хотят пойти сюда`:`${interest} women interested in this trail`}</div>
      <button class="btn btn-primary" onclick="expressInterest('${tr.id}')">${state.lang==='ru'?'Я хочу сюда в поход':'I want to hike here'}</button>
    </div>
  `;
}
function expressInterest(id) {
  state.trailInterest[id] = (state.trailInterest[id] || 0) + 1;
  save(); render();
}

function screenHikes() {
  return `
    <h2 style="font-size:22px;">${t('routesTab')}</h2>

    <div class="search-pill" style="margin-top:10px;">
      <span>🥾</span>
      <input type="text" placeholder="${state.lang==='ru'?'Поиск':'Search'}" disabled>
      <span style="font-size:12px; font-weight:700; color:var(--text-muted);">🔖 ${state.lang==='ru'?'Сохранённые':'Saved'}</span>
    </div>
    <div class="chip-row" style="margin-top:10px;">
      <div class="chip selected">${state.lang==='ru'?'Маршруты ⌄':'Routes ⌄'}</div>
      <div class="chip">${state.lang==='ru'?'Длина':'Distance'}</div>
      <div class="chip">${state.lang==='ru'?'Высота':'Elevation'}</div>
      <div class="chip">${state.lang==='ru'?'Покрытие':'Terrain'}</div>
    </div>

    <div class="route-hero">
      <svg width="100%" height="100%" viewBox="0 0 390 190" preserveAspectRatio="xMidYMid slice">
        <path d="M-20,60 C60,30 120,90 200,50 S340,20 420,70" fill="none" stroke="#C9A6AE" stroke-width="1.5" opacity="0.5"/>
        <path d="M-20,120 C70,90 150,150 230,110 S360,80 420,130" fill="none" stroke="#C9A6AE" stroke-width="1.5" opacity="0.5"/>
        <path d="M40,170 C70,120 55,80 100,60 S160,20 150,-10" fill="none" stroke="#C17A82" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
        <circle cx="95" cy="95" r="9" fill="#C17A82" opacity="0.22"/>
        <circle cx="95" cy="95" r="5" fill="#C17A82" stroke="#fff" stroke-width="2"/>
      </svg>
      <div class="badge"><span class="dot">🥾</span>${state.myRoutes.length} ${state.lang==='ru'?'моих маршрутов':'my routes'}</div>
      <button class="fab" onclick="go('recordRoute')">● ${t('recordRoute')}</button>
    </div>

    <div class="section-title">${state.lang==='ru'?'Предстоящие':'Upcoming'}</div>
    ${state.hikeStatus !== 'none' && (!state.hikeSession || state.hikeSession.status !== 'finished') ? hikeCardHTML() : `<p class="muted">${state.lang==='ru'?'Пока нет запланированных походов.':'No upcoming hikes yet.'}</p>`}

    <div class="section-title">${t('myRoutesTitle')}</div>
    ${state.myRoutes.length === 0
      ? `<p class="muted">${t('noMyRoutesYet')}</p>`
      : state.myRoutes.map(r => `
        <div class="card" style="margin-bottom:10px;">
          ${renderLiveTrack(r.points)}
          <div class="space-between" style="margin-top:8px;">
            <div style="font-weight:600; font-size:14px;">${escapeHtml(r.name)}</div>
            <span class="tag" style="background:${r.visibility==='public'?'var(--sage)':'var(--stone)'};">${r.visibility==='public' ? t('visPublic').split(' —')[0] : t('visPrivate').split(' —')[0]}</span>
          </div>
          <div class="muted" style="font-size:12px; margin-top:4px;">${r.distanceKm.toFixed(2)} km · ${r.durationMin} min · ${r.points.length} ${t('pointsCount')}</div>
          ${r.description ? `<div style="font-size:13px; margin-top:6px;">${escapeHtml(r.description)}</div>` : ''}
        </div>`).join('')}

    <div class="section-title">${t('routeHistoryTitle')}</div>
    ${state.routeHistory.length === 0
      ? `<p class="muted">${t('noHistoryYet')}</p>`
      : state.routeHistory.map(rh => `
        <div class="card route-card" style="margin-bottom:10px;">
          <div class="avatar" style="background:var(--forest);">✓</div>
          <div style="flex:1;">
            <div class="space-between">
              <div style="font-weight:600; font-size:14px;">${state.lang==='ru'?rh.trailNameRu:rh.trailName}</div>
              <span class="muted" style="font-size:12px;">${rh.date}</span>
            </div>
            <div class="muted" style="font-size:12px;">${rh.distance} km · +${rh.elevation} m ${rh.rating ? '· ' + '★'.repeat(rh.rating) : ''}</div>
            ${rh.note ? `<div style="font-size:13px; margin-top:6px;">${escapeHtml(rh.note)}</div>` : ''}
            ${rh.photos && rh.photos.length ? `<div class="thumb-row">${rh.photos.map(p=>`<img class="thumb" src="${p}">`).join('')}<span class="muted" style="align-self:center; font-size:11px;">${rh.photos.length} ${t('photosCount')}</span></div>` : ''}
          </div>
        </div>`).join('')}
  `;
}

function screenMessages() {
  return `
    <h2 style="font-size:22px;">${t('messages')}</h2>
    <div class="card row" style="margin-top:12px; cursor:pointer;" onclick="openChat('messages')">
      <div class="avatar">A</div>
      <div style="flex:1;">
        <div style="font-weight:600;">${state.lang==='ru'?SAMPLE_HIKE.trailNameRu:SAMPLE_HIKE.trailName}</div>
        <div class="muted">${(state.chatMessages[state.chatMessages.length-1]||{}).text ? (state.chatMessages[state.chatMessages.length-1].text[state.lang]||state.chatMessages[state.chatMessages.length-1].text.en) : ''}</div>
      </div>
    </div>
  `;
}

function screenNotifications() {
  const n = state.notificationSettings;
  const rows = [
    ['invites', t('notifInvites')],
    ['messages', t('notifMessages')],
    ['reminders', t('notifReminders')],
    ['weather', t('notifWeather')],
    ['waitlist', t('notifWaitlist')],
  ];
  return `
    <h2 style="font-size:22px;">${t('notificationsTitle')}</h2>
    ${rows.map(([key,label]) => `
    <div class="card toggle-row" style="padding:14px 16px; margin-top:10px;">
      <span style="font-size:13.5px; flex:1;">${label}</span>
      <div class="switch ${n[key]?'on':''}" onclick="toggleNotifSetting('${key}')"><div class="knob"></div></div>
    </div>`).join('')}
  `;
}
function toggleNotifSetting(key) { state.notificationSettings[key] = !state.notificationSettings[key]; save(); render(); }

function screenPrivacy() {
  const p = state.privacySettings;
  return `
    <h2 style="font-size:22px;">${t('privacyTitle')}</h2>
    <div class="card toggle-row" style="padding:14px 16px; margin-top:10px;">
      <span style="font-size:13.5px; flex:1;">${t('profileVisibility')}</span>
      <div class="switch ${p.profileVisible?'on':''}" onclick="togglePrivacySetting('profileVisible')"><div class="knob"></div></div>
    </div>
    <div class="card toggle-row" style="padding:14px 16px; margin-top:10px;">
      <span style="font-size:13.5px; flex:1;">${t('shareLocationDefault')}</span>
      <div class="switch ${p.shareLocationDefault?'on':''}" onclick="togglePrivacySetting('shareLocationDefault')"><div class="knob"></div></div>
    </div>

    <div class="section-title">${t('blockedUsers')}</div>
    <p class="muted">${t('noBlockedUsers')}</p>

    <button class="btn btn-outline" style="margin-top:16px;" onclick="exportMyData()">${t('exportData')}</button>
    <button class="btn btn-outline" style="margin-top:10px; border-color:var(--alert); color:var(--alert);" onclick="confirmDeleteAccount()">${t('deleteAccount')}</button>
    ${showDeleteAccountConfirm ? `
    <div class="inline-confirm">
      <p style="margin:0 0 10px; font-weight:600; color:var(--alert);">${t('deleteAccountConfirmTitle')}</p>
      <div class="row" style="gap:10px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="cancelDeleteAccount()">${state.lang==='ru'?'Отмена':'Cancel'}</button>
        <button class="btn" style="flex:1; background:var(--alert); color:#fff;" onclick="doDeleteAccount()">${t('deleteAccount')}</button>
      </div>
    </div>` : ''}
  `;
}
function togglePrivacySetting(key) { state.privacySettings[key] = !state.privacySettings[key]; save(); render(); }
function exportMyData() { showToast(t('exportRequested')); }
let showDeleteAccountConfirm = false;
function confirmDeleteAccount() { showDeleteAccountConfirm = true; render(); }
function cancelDeleteAccount() { showDeleteAccountConfirm = false; showToast(t('deleteAccountCancelled')); render(); }
function doDeleteAccount() {
  // Prototype only — there's no backend/account to actually delete, so this
  // resets local state and returns to Welcome rather than pretending to hit
  // a real endpoint.
  showDeleteAccountConfirm = false;
  localStorage.removeItem(STORAGE_KEY);
  state = defaultState();
  save();
  go('welcome');
}
function doLogOut() {
  // Non-destructive: keeps the saved profile/history in localStorage
  // (like a real app would keep your account server-side), just ends the
  // current session and sends you back to Welcome.
  state.onboarded = false;
  save();
  showToast(t('loggedOutToast'));
  go('welcome');
}

function screenProfileMe() {
  const p = state.profile;
  return `
    <div style="text-align:center; margin-top:8px;">
      <div class="avatar" style="width:70px; height:70px; font-size:26px; margin:0 auto;">${(p.name||'?').slice(0,1).toUpperCase()}</div>
      <h2 style="margin-top:12px;">${p.name || '—'}</h2>
      <div class="muted">${p.city || ''}</div>
    </div>

    <div class="row" style="margin-top:20px; gap:10px;">
      <div class="card" style="flex:1; text-align:center;">
        <div style="font-size:22px; font-weight:700;">${state.completedHikes}</div>
        <div class="muted" style="font-size:11px;">${t('hikesCompleted')}</div>
      </div>
      <div class="card" style="flex:1; text-align:center;">
        <div style="font-size:22px; font-weight:700;">${state.badges.length}</div>
        <div class="muted" style="font-size:11px;">${t('badges')}</div>
      </div>
    </div>

    <div class="section-title">${t('badges')}</div>
    ${state.badges.length ? `<div class="chip-row"><div class="chip selected">🥇 ${t('firstHikeBadge')}</div></div>` : `<p class="muted">${t('noneYet')}</p>`}

    <div class="section-title">${t('settings')}</div>
    <div class="card space-between">
      <span>${t('language')}</span>
      <div class="lang-toggle">
        <button class="${state.lang==='en'?'active':''}" onclick="toggleLang('en')">EN</button>
        <button class="${state.lang==='ru'?'active':''}" onclick="toggleLang('ru')">RU</button>
      </div>
    </div>
    <div style="margin-top:12px;">
      <button class="btn btn-outline" onclick="goToProfileBuild('profileMe')">${t('editProfile')}</button>
    </div>
    <button class="btn btn-outline" style="margin-top:10px; border-color:var(--alert); color:var(--alert);" onclick="go('safetyCenter')">🛟 ${t('safetyCenterTitle')}</button>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="go('notifications')">🔔 ${t('notificationsTitle')}</button>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="go('privacy')">🔒 ${t('privacyTitle')}</button>
    <button class="btn btn-outline" style="margin-top:10px; border-color:var(--alert); color:var(--alert);" onclick="doLogOut()">🚪 ${t('logOut')}</button>

    <p class="muted" style="margin-top:26px; font-size:12px; line-height:1.5;">${t('disclaimer')}</p>
  `;
}

// ---------- Chrome (topbar / tabbar / active bar) ----------

function renderActiveBar() {
  const el = document.getElementById('activebar');
  const preOnboard = ['welcome','motivation','profileBuild'].includes(state.screen);
  if (!preOnboard && state.hikeSession && state.hikeSession.status !== 'finished') {
    const label = state.hikeSession.status === 'paused' ? t('pause') : t('tripActive');
    el.innerHTML = `<div class="active-bar" onclick="go('activeTrip')"><span><span class="pulse"></span>${label}</span><span>${t('navMode')} →</span></div>`;
  } else {
    el.innerHTML = '';
  }
}

function renderTopbar() {
  const el = document.getElementById('topbar');
  const preOnboard = ['welcome','motivation','profileBuild'].includes(state.screen);
  if (preOnboard && state.screen !== 'welcome') {
    const backAction = state.screen==='profileBuild'
      ? `go('${profileBuildReturnTo}')`
      : `go('welcome')`;
    el.innerHTML = `<button class="back-btn" onclick="${backAction}">←</button><div class="lang-toggle"><button class="${state.lang==='en'?'active':''}" onclick="toggleLang('en')">EN</button><button class="${state.lang==='ru'?'active':''}" onclick="toggleLang('ru')">RU</button></div>`;
  } else if (!preOnboard) {
    const backMap = { hikeDetail: 'home', group: 'hikeDetail', trustedContacts: trustedContactsReturn, safetyCheck: 'group', activeTrip: null, sos: 'activeTrip', review: 'tripComplete', viewProfile: 'hikeDetail', trailDetail: 'explore', recordRoute: 'hikes', publishRoute: 'recordRoute', createEvent: 'home', safetyCenter: 'profileMe', chatScreen: chatEntryPoint, findBuddies: 'home', routeDescription: 'explore', tripComplete: null, notifications: 'profileMe', privacy: 'profileMe' };
    const backTo = backMap[state.screen];
    el.innerHTML = backTo !== undefined && backTo !== null ? `<button class="back-btn" onclick="go('${backTo}')">←</button>` : `<div style="width:36px;"></div>`;
    el.innerHTML += `<span class="display" style="font-size:15px; font-weight:600;">🥾 Trailkin</span><div style="width:36px;"></div>`;
  } else {
    el.innerHTML = '';
  }
}

function renderTabbar() {
  const el = document.getElementById('tabbar');
  const preOnboard = ['welcome','motivation','profileBuild'].includes(state.screen);
  if (preOnboard) { el.innerHTML = ''; return; }
  const tabs = [
    { key: 'home', icon: '🏠', label: t('home') },
    { key: 'explore', icon: '🧭', label: t('explore') },
    { key: 'hikes', icon: '🥾', label: t('routesTab') },
    { key: 'messages', icon: '💬', label: t('messages') },
    { key: 'profileMe', icon: '👤', label: t('profile') },
  ];
  el.innerHTML = tabs.map(tb => `
    <button class="tab ${(state.screen===tb.key || (tb.key==='hikes' && state.screen==='activeTrip'))?'active':''}" onclick="${tb.key==='hikes' ? 'goRoutesTab()' : `go('${tb.key}')`}">
      <span class="ic">${tb.icon}</span>${tb.label}
    </button>`).join('');
}
function goRoutesTab() {
  // "Routes" tab: while a hike is active, this should land on Navigation
  // (the live-tracking screen) rather than the general Routes hub.
  go(state.hikeSession && state.hikeSession.status !== 'finished' ? 'activeTrip' : 'hikes');
}

const SCREENS = {
  welcome: screenWelcome,
  motivation: screenMotivation,
  profileBuild: screenProfileBuild,
  home: screenHome,
  explore: screenExplore,
  hikes: screenHikes,
  messages: screenMessages,
  profileMe: screenProfileMe,
  hikeDetail: screenHikeDetail,
  group: screenGroup,
  trustedContacts: screenTrustedContacts,
  activeTrip: screenActiveTrip,
  sos: screenSOS,
  review: screenReview,
  viewProfile: screenViewProfile,
  trailDetail: screenTrailDetail,
  safetyCheck: screenSafetyCheck,
  recordRoute: screenRecordRoute,
  publishRoute: screenPublishRoute,
  createEvent: screenCreateEvent,
  safetyCenter: screenSafetyCenter,
  chatScreen: screenChat,
  findBuddies: screenFindBuddies,
  routeDescription: screenRouteDescription,
  tripComplete: screenTripComplete,
  notifications: screenNotifications,
  privacy: screenPrivacy,
};

function render() {
  document.documentElement.lang = state.lang;
  if (state.screen === 'activeTrip' && !state.hikeSession) state.screen = 'home';
  if (state.screen === 'publishRoute' && recording.points.length === 0) state.screen = 'hikes';
  const fn = SCREENS[state.screen] || screenHome;
  document.getElementById('screen').innerHTML = fn();
  renderTopbar();
  renderTabbar();
  renderActiveBar();
}

// init
if (!state.onboarded) { state.screen = 'welcome'; }
else if (!['home','explore','hikes','messages','profileMe','hikeDetail','group','trustedContacts','safetyCheck','activeTrip','sos','review','viewProfile','trailDetail','recordRoute','publishRoute','createEvent','safetyCenter','chatScreen','findBuddies','routeDescription','tripComplete','notifications','privacy'].includes(state.screen)) {
  state.screen = 'home';
}
render();

// While a hike is active and the nav screen is open, take one fresh GPS fix
// every 30s (getCurrentPosition, not a continuous watchPosition stream) to
// advance route progress/off-route status — deliberately not polling when
// the hike is paused, finished, or the screen isn't open, per the battery
// guidance above. Also keeps the elapsed-time display ticking.
setInterval(() => {
  const s = state.hikeSession;
  if (s && s.status === 'active' && state.screen === 'activeTrip') {
    if (locationStatus !== 'requesting' && locationStatus !== 'unsupported') requestLocation();
    else render();
  }
}, 30000);
</script>
